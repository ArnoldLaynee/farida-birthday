name: Build Signed Android APK & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed Release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Prepare Super-Farida-World.apk
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Super-Farida-World.apk
          ls -lh Super-Farida-World.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Super-Farida-World-APK
          path: Super-Farida-World.apk

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 Super-Farida-World.apk --clobber
          else
            gh release create v1.0.0 Super-Farida-World.apk \
              --title "Super Farida World v1.0.0 (Android APK)" \
              --notes "🎂 **Super Farida World** — Standalone Offline Android APK! Download **Super-Farida-World.apk** below and tap to install on any Android phone."
          fi
